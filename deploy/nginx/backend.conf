# Shared nginx config for remote server
# This file handles both dojo-tracker and dojo-games domains

server {
    listen [::]:80;
    listen 80;
    server_name dojo-tracker.japan-dojo.com games.japan-dojo.com;

    location /.well-known/acme-challenge {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name dojo-tracker.japan-dojo.com;

    ssl_certificate /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/privkey.pem;

    client_max_body_size 1M;

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-tracker-app:3000;
    }
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name games.japan-dojo.com;

    ssl_certificate /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/privkey.pem;

    client_max_body_size 10M;

    # API on the backend; the frontend is on Firebase. Proxied, not redirected, to keep the
    # address bar on games.japan-dojo.com and /api same-origin.

    location /api {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-games-backend:5001;
    }

    # Distinct from /api/health; the games `rake deploy` verifies this exact URL.
    location = /health {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-games-backend:5001;
    }

    location / {
        # resolver + the variable force runtime DNS (a literal name in proxy_pass is resolved
        # once at startup); Firebase needs SNI and routes by Host.
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $games_frontend https://dojo-games.web.app;

        proxy_pass $games_frontend;
        proxy_ssl_server_name on;
        proxy_set_header Host dojo-games.web.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_redirect https://dojo-games.web.app/ https://$host/;
    }
}
