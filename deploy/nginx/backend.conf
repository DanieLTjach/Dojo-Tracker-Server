# Shared nginx config for remote server
# This file handles dojo-tracker, dojo-games, tracker.japan-dojo.com, and riichi-dojo.com

map $http_user_agent $is_crawler {
    default 0;
    ~*(Telegram|facebookexternalhit|Twitterbot|Slackbot|WhatsApp|Discordbot|LinkedInBot|Googlebot|bingbot) 1;
}

server {
    listen [::]:80;
    listen 80;
    server_name dojo-tracker.japan-dojo.com games.japan-dojo.com tracker.japan-dojo.com riichi-dojo.com www.riichi-dojo.com;

    location /.well-known/acme-challenge {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name dojo-tracker.japan-dojo.com;

    ssl_certificate /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/privkey.pem;

    client_max_body_size 1M;

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-tracker-app:3000;
    }
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name games.japan-dojo.com;

    ssl_certificate /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/privkey.pem;

    client_max_body_size 10M;

    # API on the backend; the frontend is on Firebase. Proxied, not redirected, to keep the
    # address bar on games.japan-dojo.com and /api same-origin.

    location /api {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-games-backend:5001;
    }

    # Distinct from /api/health; the games `rake deploy` verifies this exact URL.
    location = /health {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-games-backend:5001;
    }

    location / {
        # resolver + the variable force runtime DNS (a literal name in proxy_pass is resolved
        # once at startup); Firebase needs SNI and routes by Host.
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $games_frontend https://dojo-games.web.app;

        proxy_pass $games_frontend;
        proxy_ssl_server_name on;
        proxy_set_header Host dojo-games.web.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_redirect https://dojo-games.web.app/ https://$host/;
    }
}

# Redirect, not a second home: share links are minted on the apex.
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name www.riichi-dojo.com;

    ssl_certificate /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/privkey.pem;

    return 301 https://riichi-dojo.com$request_uri;
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name tracker.japan-dojo.com riichi-dojo.com;

    ssl_certificate /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/privkey.pem;

    client_max_body_size 10M;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    set $tracker_frontend https://mahjong-tma-1.web.app;

    location /api {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-tracker-app:3000;
    }

    # Crawlers get server-rendered OG tags, humans get the SPA. Named location
    # because `if` cannot carry proxy_set_header.
    location ~ ^/posts/ {
        error_page 418 = @crawler_post;
        recursive_error_pages on;
        if ($is_crawler) { return 418; }

        proxy_pass $tracker_frontend;
        proxy_ssl_server_name on;
        proxy_set_header Host mahjong-tma-1.web.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect https://mahjong-tma-1.web.app/ https://$host/;
    }

    location ~ ^/users/[^/]+/achievements {
        error_page 418 = @crawler_achievement;
        recursive_error_pages on;
        if ($is_crawler) { return 418; }

        proxy_pass $tracker_frontend;
        proxy_ssl_server_name on;
        proxy_set_header Host mahjong-tma-1.web.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect https://mahjong-tma-1.web.app/ https://$host/;
    }

    # Reachable directly so OG rendering can be curl'd without faking a UA.
    location /share/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-tracker-app:3000;
    }

    location @crawler_post {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-tracker-app:3000/share$request_uri;
    }

    location @crawler_achievement {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-tracker-app:3000/share$request_uri;
    }

    location / {
        proxy_pass $tracker_frontend;
        proxy_ssl_server_name on;
        proxy_set_header Host mahjong-tma-1.web.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect https://mahjong-tma-1.web.app/ https://$host/;
    }
}
