# Shared nginx config for remote server
# This file handles both dojo-tracker and dojo-games domains

server {
    listen [::]:80;
    listen 80;
    server_name dojo-tracker.japan-dojo.com games.japan-dojo.com;

    location /.well-known/acme-challenge {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name dojo-tracker.japan-dojo.com;

    ssl_certificate /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/privkey.pem;

    client_max_body_size 1M;

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-tracker-app:3000;
    }
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name games.japan-dojo.com;

    ssl_certificate /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/privkey.pem;

    client_max_body_size 10M;

    # This vhost is split between two origins. The Ruby backend keeps the API (and the
    # root-level /health the games deploy runbook curls); everything else is the React
    # frontend, which is hosted on Firebase rather than on this box.
    #
    # It is proxied rather than redirected so the address bar stays games.japan-dojo.com:
    # the frontend calls the API as a same-origin /api path (VITE_API_URL), so bouncing
    # users to dojo-games.web.app would show the wrong domain and cross the origin.

    location /api {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-games-backend:5001;
    }

    # Root-level health check, distinct from /api/health. `rake deploy` verifies this exact
    # URL, so it must not fall through to the frontend.
    location = /health {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-games-backend:5001;
    }

    location / {
        # Firebase Hosting serves the games frontend. Three things are needed to proxy to it:
        #   - resolver: the upstream is a public hostname, so nginx must resolve it at runtime
        #     (a name in proxy_pass is otherwise resolved once at startup and cached forever).
        #   - proxy_ssl_server_name: Firebase terminates TLS per-SNI; without it the handshake
        #     gets the wrong certificate.
        #   - Host: Firebase routes by Host header, so it must name the Firebase site, not us.
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $games_frontend https://dojo-games.web.app;

        proxy_pass $games_frontend;
        proxy_ssl_server_name on;
        proxy_set_header Host dojo-games.web.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Firebase may answer a proxied request with a redirect naming its own host; rewrite
        # those back so a user is never bounced off games.japan-dojo.com.
        proxy_redirect https://dojo-games.web.app/ https://$host/;
    }
}
