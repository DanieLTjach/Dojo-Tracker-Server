# Shared nginx config for remote server
# This file handles both dojo-tracker and dojo-games domains

server {
    listen [::]:80;
    listen 80;
    server_name dojo-tracker.japan-dojo.com games.japan-dojo.com;

    location /.well-known/acme-challenge {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    # `http2 on` replaces the old `listen ... http2` suffix, deprecated since nginx 1.25.1.
    # The suffix still worked but warned four times per config parse, and nginx parses on both
    # `-t` and `-s reload` — so every deploy of either project printed 16 lines of deprecation
    # notices. It is a per-server directive now, so one line covers both listen addresses.
    http2 on;
    server_name dojo-tracker.japan-dojo.com;

    ssl_certificate /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/privkey.pem;

    client_max_body_size 1M;

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-tracker-app:3000;
    }
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name games.japan-dojo.com;

    ssl_certificate /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo-tracker.japan-dojo.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://dojo-games-backend:5001;
    }
}
